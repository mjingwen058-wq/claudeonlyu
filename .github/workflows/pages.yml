# 把 web/ 发布到 GitHub Pages：https://mjingwen058-wq.github.io/claudeonlyu/
# 第一次使用前，需要在仓库 Settings → Pages → Source 里选 “GitHub Actions”
name: Deploy web to Pages

on:
  push:
    branches: [claude/magical-pascal-mbuwh7, claude/peaceful-shannon-fly8rs, main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
